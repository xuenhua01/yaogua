<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>物料报表</title>
  <style>
    :root {
      --bar: #fff;
      --bg: #f4f6f8;
      --ink: #1d2d3e;
      --muted: #556b82;
      --line: #d9e1e8;
      --brand: #0070f2;
      --card: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "72", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
    }
    header a { color: var(--brand); text-decoration: none; font-size: 14px; }
    header h1 { margin: 0; font-size: 16px; font-weight: 700; }
    main { max-width: 1120px; margin: 0 auto; padding: 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(29, 45, 62, 0.06);
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
    }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
    input {
      height: 36px;
      min-width: 140px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      color: var(--ink);
    }
    input:focus { outline: 2px solid rgba(0, 112, 242, 0.25); border-color: var(--brand); }
    button {
      height: 36px;
      padding: 0 14px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #fff;
      font: inherit;
      cursor: pointer;
    }
    button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
    }
    .meta h2 { margin: 0; font-size: 16px; }
    .count { color: var(--muted); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 20px; text-align: left; font-size: 14px; border-top: 1px solid var(--line); }
    th { font-size: 12px; color: var(--muted); font-weight: 600; background: #fafbfc; }
    tbody tr:hover { background: #f5f9ff; }
    .tag {
      display: inline-block;
      min-width: 3rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e8f3ff;
      color: #0057d2;
      font-size: 12px;
      text-align: center;
    }
    .msg { padding: 28px 20px; color: var(--muted); }
    .err { color: #aa0808; }
  </style>
</head>
<body>
  <header>
    <a href="/">返回</a>
    <h1>徐大侠demo合集 · 物料报表</h1>
  </header>
  <main>
    <section class="card">
      <form class="filters" id="filters">
        <label>物料编码<input id="matnr" placeholder="MATNR" /></label>
        <label>物料描述<input id="maktx" placeholder="MAKTX" /></label>
        <label>物料类型<input id="mtart" placeholder="MTART" /></label>
        <label>物料组<input id="matkl" placeholder="MATKL" /></label>
        <button class="primary" type="submit">查询</button>
        <button type="reset" id="clear">清空</button>
      </form>
      <div class="meta">
        <h2>物料主数据</h2>
        <div class="count" id="count">加载中…</div>
      </div>
      <table>
        <thead>
          <tr>
            <th>物料编码</th>
            <th>物料描述</th>
            <th>物料类型</th>
            <th>物料组</th>
            <th>基本单位</th>
            <th>行业</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="msg" id="msg" hidden></div>
    </section>
  </main>
  <script>
    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function quote(value) {
      return String(value).replace(/'/g, "''");
    }
    function load() {
      var filters = [];
      var matnr = document.getElementById("matnr").value.trim();
      var maktx = document.getElementById("maktx").value.trim();
      var mtart = document.getElementById("mtart").value.trim();
      var matkl = document.getElementById("matkl").value.trim();
      if (matnr) filters.push("contains(MATNR,'" + quote(matnr) + "')");
      if (maktx) filters.push("contains(MAKTX,'" + quote(maktx) + "')");
      if (mtart) filters.push("MTART eq '" + quote(mtart) + "'");
      if (matkl) filters.push("contains(MATKL,'" + quote(matkl) + "')");
      var url = "/odata/v4/catalog/Materials";
      if (filters.length) url += "?$filter=" + encodeURIComponent(filters.join(" and "));
      var count = document.getElementById("count");
      var msg = document.getElementById("msg");
      var body = document.getElementById("rows");
      count.textContent = "加载中…";
      fetch(url).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      }).then(function (data) {
        var rows = data.value || [];
        body.innerHTML = rows.map(function (row) {
          return "<tr><td>" + esc(row.MATNR) + "</td><td>" + esc(row.MAKTX) +
            "</td><td><span class=\"tag\">" + esc(row.MTART) + "</span></td><td>" +
            esc(row.MATKL) + "</td><td>" + esc(row.MEINS) + "</td><td>" +
            esc(row.MBRSH) + "</td></tr>";
        }).join("");
        count.textContent = "共 " + rows.length + " 条";
        msg.hidden = rows.length > 0;
        msg.className = "msg";
        msg.textContent = rows.length ? "" : "没有符合条件的物料";
      }).catch(function (e) {
        body.innerHTML = "";
        count.textContent = "加载失败";
        msg.hidden = false;
        msg.className = "msg err";
        msg.textContent = e.message;
      });
    }
    document.getElementById("filters").addEventListener("submit", function (event) {
      event.preventDefault();
      load();
    });
    document.getElementById("clear").addEventListener("click", function () {
      setTimeout(load, 0);
    });
    load();
  </script>
</body>
</html>
