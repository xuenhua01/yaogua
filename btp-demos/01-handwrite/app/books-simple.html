<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Books UI5 Simple</title>
  <script>
    window.booksSimpleInit = function () {
      var oModel = new sap.ui.model.json.JSONModel();
      function loadBooks() {
        fetch("/odata/v4/catalog/Books")
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (data) {
            oModel.setData(data);
          })
          .catch(function (e) {
            sap.m.MessageBox.error("加载失败: " + e.message);
          });
      }
      function csrfToken() {
        return fetch("/odata/v4/catalog/", { headers: { "x-csrf-token": "fetch" } })
          .then(function (r) { return r.headers.get("x-csrf-token"); });
      }
      function saveBook(book, isNew) {
        return csrfToken().then(function (token) {
          var url = "/odata/v4/catalog/Books" + (isNew ? "" : "(" + book.ID + ")");
          return fetch(url, {
            method: isNew ? "POST" : "PATCH",
            headers: {
              "Content-Type": "application/json",
              "x-csrf-token": token || "",
              "If-Match": "*"
            },
            body: JSON.stringify({
              ID: Number(book.ID),
              title: book.title,
              author: book.author
            })
          });
        }).then(function (r) {
          if (!r.ok) return r.text().then(function (t) { throw new Error("HTTP " + r.status + " " + t); });
          sap.m.MessageToast.show("已保存到 HANA");
          loadBooks();
        }).catch(function (e) {
          sap.m.MessageBox.error("保存失败: " + e.message);
        });
      }
      function openEditor(book, isNew) {
        var titleInput = new sap.m.Input({ value: book.title || "" });
        var authorInput = new sap.m.Input({ value: book.author || "" });
        var dialog = new sap.m.Dialog({
          title: isNew ? "新建一本书" : "编辑 ID " + book.ID,
          content: [
            new sap.m.Label({ text: "书名" }),
            titleInput,
            new sap.m.Label({ text: "作者" }),
            authorInput
          ],
          beginButton: new sap.m.Button({
            text: "保存",
            type: "Emphasized",
            press: function () {
              book.title = titleInput.getValue();
              book.author = authorInput.getValue();
              dialog.close();
              saveBook(book, isNew);
            }
          }),
          endButton: new sap.m.Button({
            text: "取消",
            press: function () { dialog.close(); }
          }),
          afterClose: function () { dialog.destroy(); }
        });
        dialog.open();
      }
      var oTable = new sap.m.Table({
        headerToolbar: new sap.m.Toolbar({
          content: [
            new sap.m.Title({ text: "Books（保存到 HANA）" }),
            new sap.m.ToolbarSpacer(),
            new sap.m.Button({
              text: "新建",
              press: function () {
                var rows = (oModel.getProperty("/value") || []).map(function (b) { return Number(b.ID) || 0; });
                var nextId = rows.length ? Math.max.apply(null, rows) + 1 : 1;
                openEditor({ ID: nextId, title: "", author: "" }, true);
              }
            }),
            new sap.m.Button({ text: "刷新", press: loadBooks })
          ]
        }),
        columns: [
          new sap.m.Column({ header: new sap.m.Text({ text: "ID" }) }),
          new sap.m.Column({ header: new sap.m.Text({ text: "Title" }) }),
          new sap.m.Column({ header: new sap.m.Text({ text: "Author" }) }),
          new sap.m.Column({ header: new sap.m.Text({ text: "" }), width: "6rem" })
        ]
      });
      oTable.bindItems({
        path: "/value",
        template: new sap.m.ColumnListItem({
          cells: [
            new sap.m.Text({ text: "{ID}" }),
            new sap.m.Text({ text: "{title}" }),
            new sap.m.Text({ text: "{author}" }),
            new sap.m.Button({
              text: "编辑",
              press: function (event) {
                openEditor(Object.assign({}, event.getSource().getBindingContext().getObject()), false);
              }
            })
          ]
        })
      });
      oTable.setModel(oModel);
      new sap.m.App({
        pages: [
          new sap.m.Page({
            title: "ZXH_BTP_Handwrite",
            content: [oTable]
          })
        ]
      }).placeAt("content");
      loadBooks();
    };
  </script>
  <script
    id="sap-ui-bootstrap"
    src="https://ui5.sap.com/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-libs="sap.m"
    data-sap-ui-async="true"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-oninit="booksSimpleInit">
  </script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
