<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Books</title>
  <style>
    body { font-family: Segoe UI, sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; max-width: 720px; }
    th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
    th { background: #f3f3f3; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <h1>Books</h1>
  <p><a href="/">← 首页</a></p>
  <p id="status">加载中…</p>
  <table id="books" hidden>
    <thead>
      <tr><th>ID</th><th>Title</th><th>Author</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <script>
    fetch("/odata/v4/catalog/Books")
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(data => {
        const rows = data.value || [];
        const tbody = document.querySelector("#books tbody");
        rows.forEach(b => {
          const tr = document.createElement("tr");
          tr.innerHTML =
            "<td>" + b.ID + "</td>" +
            "<td>" + (b.title || "") + "</td>" +
            "<td>" + (b.author || "") + "</td>";
          tbody.appendChild(tr);
        });
        document.getElementById("status").textContent = "共 " + rows.length + " 本";
        document.getElementById("books").hidden = false;
      })
      .catch(e => {
        document.getElementById("status").className = "err";
        document.getElementById("status").textContent = "加载失败: " + e.message;
      });
  </script>
</body>
</html>
